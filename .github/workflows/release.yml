name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    name: Move production branch to tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # Vercel's production branch is `production`; Vercel deploys on this push.
      - name: Push tagged commit to production
        run: git push --force origin "$GITHUB_SHA:refs/heads/production"
