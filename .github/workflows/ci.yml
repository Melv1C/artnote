name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    env:
      # Prisma needs a datasource URL to generate the client; it never connects
      PRISMA_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      # Installs Vite+, Node from devEngines.runtime and Bun from packageManager (package.json),
      # then runs `vp install`
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-toolchain: true

      - run: vp run check

      - name: Fail if the build changed committed files (route tree)
        run: git diff --exit-code

      - run: vp pm audit -- --audit-level=critical

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: artnote
          POSTGRES_PASSWORD: artnote
          POSTGRES_DB: artnote
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artnote" --health-interval 2s --health-timeout 5s
          --health-retries 15
    env:
      # The run uses artnote_e2e on port 4000 (scripts/e2e-env.ts)
      PRISMA_DATABASE_URL: postgresql://artnote:artnote@localhost:5432/artnote
      BASE_URL: http://localhost:3000
      # Image uploads go to the MinIO of compose.yaml, as locally (.env.example)
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: artnote
      S3_ACCESS_KEY_ID: artnote
      S3_SECRET_ACCESS_KEY: artnote-dev-storage
      S3_PUBLIC_URL: http://localhost:9000/artnote
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          cache-toolchain: true

      - run: vp exec prisma generate

      - run: vp exec playwright install --with-deps chromium

      # MinIO and its bucket, started as worktree:setup does: a job service cannot take MinIO's command
      - run: docker compose up -d --wait storage && docker compose run --rm storage-init

      - run: vp run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
