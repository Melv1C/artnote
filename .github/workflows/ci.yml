name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  NODE_VERSION: '24'

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6 # version comes from package.json packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          # Provide a dummy DATABASE_URL for generation in CI
          PRISMA_DATABASE_URL: 'prisma+postgres://accelerate.prisma-data.net/?api_key=some_api_key'

      - name: Run Lint
        run: pnpm lint

      - name: Run TypeScript check
        run: pnpm type-check

