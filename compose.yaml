name: artnote

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: artnote
      POSTGRES_PASSWORD: artnote
      POSTGRES_DB: artnote
    ports:
      - '5432:5432'
    volumes:
      - artnote-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artnote -d artnote']
      interval: 2s
      timeout: 3s
      retries: 30

  # Object storage for image and avatar uploads, as on Dokploy. MinIO no longer publishes images;
  # pgsty/minio is the community-maintained build of it.
  storage:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: artnote
      MINIO_ROOT_PASSWORD: artnote-dev-storage
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - artnote-storage:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates the shared `artnote` bucket, readable by anyone but not listable (`db:setup` runs it)
  storage-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    profiles: [setup]
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/storage/init-bucket.sh']
    environment:
      S3_ENDPOINT: http://storage:9000
      S3_ROOT_USER: artnote
      S3_ROOT_PASSWORD: artnote-dev-storage
      S3_BUCKET: artnote
    volumes:
      - ./scripts/storage:/storage:ro

volumes:
  artnote-db:
  artnote-storage:
